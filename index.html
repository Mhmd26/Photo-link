<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>شات ذكاء اصطناعي</title>  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Tahoma, sans-serif;
    }

    body {
      background: #0f172a;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .chat-box {
      width: 100%;
      max-width: 900px;
      height: 95vh;
      background: #111827;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #1f2937;
      box-shadow: 0 0 30px rgba(0,0,0,0.4);
    }

    .top-bar {
      background: #1e293b;
      padding: 18px;
      color: white;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      border-bottom: 1px solid #334155;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      background: #0f172a;
    }

    .message {
      max-width: 80%;
      padding: 14px 18px;
      border-radius: 18px;
      line-height: 1.8;
      font-size: 16px;
      word-wrap: break-word;
    }

    .user {
      align-self: flex-start;
      background: #2563eb;
      color: white;
      border-bottom-left-radius: 5px;
    }

    .bot {
      align-self: flex-end;
      background: #1e293b;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .bottom {
      display: flex;
      gap: 10px;
      padding: 15px;
      background: #111827;
      border-top: 1px solid #1f2937;
    }

    input {
      flex: 1;
      padding: 15px;
      border-radius: 14px;
      border: none;
      outline: none;
      background: #1e293b;
      color: white;
      font-size: 16px;
    }

    button {
      padding: 15px 22px;
      border: none;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #1d4ed8;
    }

    .typing {
      opacity: 0.7;
      font-style: italic;
    }

    @media (max-width: 600px) {
      .message {
        max-width: 92%;
      }

      .top-bar {
        font-size: 18px;
      }

      button {
        padding: 12px 16px;
      }
    }
  </style></head>
<body>  <div class="chat-box">
    <div class="top-bar">
      شات ذكاء اصطناعي
    </div><div class="messages" id="messages">
  <div class="message bot">
    مرحباً 👋<br>
    اكتب أي شيء للتحدث مع الذكاء الاصطناعي.
  </div>
</div>

<div class="bottom">
  <input type="text" id="input" placeholder="اكتب رسالتك هنا...">
  <button onclick="sendMessage()">إرسال</button>
</div>

  </div>  <script>
    const messages = document.getElementById('messages');
    const input = document.getElementById('input');

    // ضع مفتاح Gemini API هنا
    const API_KEY = 'AIzaSyDPz4xhbnYfk4OPwltVHmC21pp25hBCSz8';

    async function sendMessage() {
      const text = input.value.trim();

      if (!text) return;

      addMessage(text, 'user');
      input.value = '';

      const typingDiv = addMessage('جاري الكتابة...', 'bot typing');

      try {
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`,
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              contents: [
                {
                  parts: [
                    {
                      text: text
                    }
                  ]
                }
              ]
            })
          }
        );

        const data = await response.json();

        typingDiv.remove();

        const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || 'حدث خطأ أثناء الرد';

        addMessage(reply, 'bot');

      } catch (error) {
        typingDiv.remove();
        addMessage('فشل الاتصال بالذكاء الاصطناعي', 'bot');
        console.error(error);
      }
    }

    function addMessage(text, type) {
      const div = document.createElement('div');
      div.className = `message ${type}`;
      div.innerHTML = text.replace(/\n/g, '<br>');

      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;

      return div;
    }

    input.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });
  </script></body>
</html>
