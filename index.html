<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>SC Voice | NEON AI STUDIO - تسجيل احترافي 192kHz</title>
    <!-- خطوط احترافية عصرية -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.all.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-deep: #03020A;
            --bg-card: rgba(8, 5, 20, 0.82);
            --glass-border: rgba(156, 82, 255, 0.6);
            --neon-purple: #b77cff;
            --neon-magenta: #ff44e6;
            --neon-cyan: #00f7ff;
            --neon-red: #ff3a6f;
            --glow-purple: 0 0 12px rgba(156, 82, 255, 0.7);
            --text-white: #ffffff;
            --text-offwhite: #f0f0f4;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            position: relative;
            font-family: 'Cairo', 'Inter', sans-serif;
            color: var(--text-white);
            overflow-x: hidden;
        }

        /* === خلفية متموجة ديناميكية فائقة الحركة === */
        .dynamic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 40% 50%, #1f0540, #050012);
            overflow: hidden;
        }

        /* طبقات الأمواج السائلة */
        .wave-layer {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(ellipse at 30% 40%, rgba(156, 82, 255, 0.25), transparent 60%);
            border-radius: 38% 62% 41% 59% / 55% 48% 52% 45%;
            animation: slowDrift 22s infinite alternate ease-in-out;
            mix-blend-mode: overlay;
        }

        .wave-layer:nth-child(2) {
            background: radial-gradient(ellipse at 70% 65%, rgba(255, 68, 230, 0.2), transparent 70%);
            border-radius: 52% 48% 63% 37% / 41% 56% 44% 59%;
            animation: slowDrift 28s infinite alternate-reverse;
            animation-delay: -2s;
        }

        .wave-layer:nth-child(3) {
            background: radial-gradient(circle at 20% 80%, rgba(0, 247, 255, 0.18), transparent 70%);
            border-radius: 44% 56% 34% 66% / 60% 42% 58% 40%;
            animation: slowDrift 18s infinite alternate;
            animation-delay: -5s;
        }

        .wave-layer:nth-child(4) {
            background: repeating-linear-gradient(45deg, rgba(183, 124, 255, 0.08) 0px, rgba(183, 124, 255, 0.08) 2px, transparent 2px, transparent 8px);
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border-radius: 0;
            animation: gridShift 12s linear infinite;
        }

        @keyframes slowDrift {
            0% {
                transform: translate(-5%, -5%) rotate(0deg) scale(1);
            }
            100% {
                transform: translate(8%, 8%) rotate(8deg) scale(1.2);
            }
        }

        @keyframes gridShift {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: 45px 45px;
            }
        }

        /* SPLASH SCREEN - واجهة دخول متحركة أنيقة (أبطأ وأكثر نعومة) */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #16062e, #020008);
            backdrop-filter: blur(2px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 1.6s cubic-bezier(0.19, 1, 0.22, 1), visibility 0s 1.6s;
            will-change: opacity;
            opacity: 1;
            visibility: visible;
        }

        .splash-screen.hide {
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.2s cubic-bezier(0.23, 1, 0.32, 1), visibility 0s 1.2s;
        }

        .splash-logo {
            text-align: center;
            transform: scale(0.9);
            animation: splashPop 1.9s cubic-bezier(0.34, 1.2, 0.64, 1) forwards;
        }

        @keyframes splashPop {
            0% {
                opacity: 0;
                transform: scale(0.5) rotate(-6deg);
            }
            50% {
                opacity: 0.7;
                transform: scale(1.08) rotate(1deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0);
            }
        }

        .splash-icon {
            font-size: 5.5rem;
            background: linear-gradient(135deg, #ffb7ff, #b77eff, #ff66e6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px #ff44e6;
            animation: iconPulse 2.2s infinite alternate;
        }

        @keyframes iconPulse {
            0% {
                text-shadow: 0 0 8px #ff44e6, 0 0 12px #b77eff;
                transform: scale(1);
            }
            100% {
                text-shadow: 0 0 28px #ff90f0, 0 0 36px #a16eff;
                transform: scale(1.04);
            }
        }

        .splash-title {
            font-size: 2.9rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #e4baff, #ffaeff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-top: 1rem;
            letter-spacing: -0.5px;
        }

        .splash-sub {
            font-size: 1rem;
            color: #dacdff;
            font-weight: 500;
            margin-top: 0.7rem;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
        }

        .pulse-ring {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(156, 82, 255, 0.2);
            position: absolute;
            animation: ringExpand 2.2s infinite;
            z-index: -1;
        }

        @keyframes ringExpand {
            0% {
                transform: scale(0.5);
                opacity: 0.8;
            }
            100% {
                transform: scale(2.2);
                opacity: 0;
            }
        }

        /* واجهة التطبيق الرئيسية (تظهر بعد السبلاش) */
        .phone-app {
            max-width: 550px;
            width: 100%;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: 2.5rem;
            padding: 2rem 1.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 0 1px var(--glass-border), 0 0 20px rgba(156, 82, 255, 0.3);
            transition: all 0.2s;
            border: 1px solid rgba(156, 82, 255, 0.5);
            position: relative;
            z-index: 10;
            opacity: 0;
            transform: translateY(15px);
            animation: appFadeIn 0.9s ease forwards;
            animation-delay: 0.2s;
        }

        @keyframes appFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .welcome-toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: rgba(8, 5, 28, 0.88);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            padding: 12px 30px;
            font-size: 1.15rem;
            font-weight: 600;
            color: white;
            box-shadow: 0 0 28px #c07eff, 0 0 0 1px #ffb7ff;
            z-index: 1500;
            white-space: nowrap;
            font-family: 'Cairo', sans-serif;
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.35s ease;
            pointer-events: none;
        }
        
        .welcome-toast.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        .welcome-toast i {
            font-size: 1.6rem;
            color: #ff9ef5;
        }

        /* باقي الأنماط الأصلية محسنة */
        .app-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .app-header h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #d9b4ff, #f0a6ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }
        .app-header p {
            font-size: 0.75rem;
            color: #e0d4ff;
            text-shadow: 0 0 3px #6d4aff;
            font-weight: 500;
        }

        .time-box {
            background: rgba(2, 1, 12, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 2rem;
            padding: 0.9rem;
            text-align: center;
            margin-bottom: 0.8rem;
            border: 1px solid var(--glass-border);
            box-shadow: 0 0 12px rgba(156, 82, 255, 0.3);
        }
        .timer {
            font-size: 2.8rem;
            font-weight: 800;
            font-family: 'Inter', monospace;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 8px #b77cff;
            direction: ltr;
        }
        .status-label {
            font-size: 0.75rem;
            margin-top: 6px;
            font-weight: 600;
            color: #e0d4ff;
        }
        .status-label.recording {
            color: #ff66c0;
            text-shadow: 0 0 6px #ff44e6;
            animation: pulseGlow 1s infinite;
        }
        .status-label.playing {
            color: #00f7ff;
            text-shadow: 0 0 6px #00f7ff;
        }

        @keyframes pulseGlow {
            0% { text-shadow: 0 0 2px #ff44e6; opacity: 0.9; }
            100% { text-shadow: 0 0 12px #ff66f0; opacity: 1; }
        }

        .load-bar-container {
            background: rgba(0, 0, 0, 0.75);
            border-radius: 20px;
            padding: 1px;
            margin-bottom: 1.8rem;
            border: 1px solid #9b6eff;
            box-shadow: 0 0 8px rgba(156,82,255,0.6);
            height: 10px;
            position: relative;
            overflow: hidden;
            direction: ltr;
        }
        .load-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff44e6, #b77cff, #ffb86c);
            border-radius: 20px;
            box-shadow: 0 0 12px #ff44e6;
            transition: width 0.025s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            will-change: width;
        }

        .controls-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: nowrap;
        }
        .ctrl-side, .ctrl-center, .small-btn, .upload-label {
            background: linear-gradient(135deg, #2a1b5e, #13102e);
            border: 1px solid #b77eff;
            color: #ffffff;
            font-weight: 600;
            transition: all 0.08s linear;
            cursor: pointer;
            outline: none;
            font-family: 'Cairo', sans-serif;
        }
        .ctrl-side:active, .ctrl-center:active, .small-btn:active, .upload-label:active {
            transform: scale(0.96);
            box-shadow: 0 0 16px #c58aff;
        }
        .ctrl-side {
            width: 70px;
            padding: 12px 0;
            border-radius: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.5);
        }
        /* جعل زر التسجيل أكبر وأيقونته مميزة */
        .ctrl-center {
            width: 130px;
            padding: 22px 0;
            border-radius: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 1.1rem;
            box-shadow: 0 0 24px #b56eff;
            transition: all 0.1s;
        }
        .ctrl-center i {
            font-size: 2.2rem;
        }
        .ctrl-side i, .ctrl-center i {
            filter: drop-shadow(0 0 3px #ffb3f0);
        }
        .disabled-btn {
            opacity: 0.45;
            filter: grayscale(0.2);
            pointer-events: none;
            transform: none;
        }
        .file-upload-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 5, 25, 0.7);
            backdrop-filter: blur(5px);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            margin-bottom: 1.2rem;
            border: 1px solid #7c51d1;
        }
        .upload-label {
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .fx-collapse {
            margin-top: 1rem;
            border-top: 1px solid #7b52cf;
            padding-top: 0.8rem;
        }
        .fx-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 700;
            color: #f0eaff;
            padding: 8px 0;
            font-size: 0.9rem;
        }
        .fx-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.38s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: max-height;
        }
        .fx-content.open {
            max-height: 1350px;
        }
        .fx-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin: 14px 0;
        }
        .fx-card {
            background: rgba(2, 1, 15, 0.75);
            backdrop-filter: blur(6px);
            padding: 12px 14px;
            border-radius: 1.5rem;
            border: 1px solid #8866dd;
        }
        .fx-card label {
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 6px;
            gap: 8px;
        }
        .control-with-buttons {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 6px;
        }
        .control-with-buttons input {
            flex: 1;
        }
        .step-btn {
            background: #2f2170;
            border: 1px solid #c59aff;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.05s linear;
        }
        .step-btn:active {
            transform: scale(0.92);
            background: #a16eff;
        }
        input[type="range"] { 
            width: 100%; 
            background: #352a60; 
            height: 5px; 
            border-radius: 10px;
            accent-color: #d696ff;
        }
        .small-btn {
            padding: 8px 18px;
            border-radius: 2rem;
            font-size: 0.75rem;
            margin: 4px;
            box-shadow: 0 0 6px #b77eff;
        }
        .action-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 16px 0 8px;
        }
        .status-toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 2, 28, 0.98);
            backdrop-filter: blur(18px);
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 600;
            z-index: 1000;
            box-shadow: 0 0 24px #ac7eff, 0 0 0 1px #c58eff;
            pointer-events: none;
            white-space: nowrap;
            border-right: 5px solid #ff66e6;
        }
        footer {
            text-align: center;
            font-size: 0.6rem;
            margin-top: 1.4rem;
            color: #cfbef9;
        }
        #procStatus {
            background: #060213cc;
            border: 1px solid #9d6eff;
            color: #f2eaff;
            border-radius: 30px;
            padding: 8px 12px;
            text-align: center;
            font-size: 0.7rem;
            font-weight: 500;
        }
        @media (max-width: 450px) {
            .ctrl-center { width: 110px; padding: 18px 0; }
            .ctrl-center i { font-size: 1.9rem; }
            .ctrl-side { width: 60px; }
            .timer { font-size: 2.2rem; }
            .phone-app { padding: 1.5rem 1rem; }
            .welcome-toast { font-size: 0.95rem; padding: 8px 20px; white-space: nowrap; }
        }
    </style>
</head>
<body>

<!-- خلفية متموجة ديناميكية -->
<div class="dynamic-bg">
    <div class="wave-layer"></div>
    <div class="wave-layer"></div>
    <div class="wave-layer"></div>
    <div class="wave-layer"></div>
</div>

<!-- SPLASH SCREEN متحرك -->
<div id="splashScreen" class="splash-screen">
    <div class="pulse-ring" style="width:130px; height:130px;"></div>
    <div class="splash-logo">
        <i class="fas fa-microphone-alt splash-icon"></i>
        <div class="splash-title">SC Voice</div>
        <div class="splash-sub"><i class="fas fa-satellite-dish"></i> NEON AI STUDIO | 192kHz</div>
    </div>
</div>

<!-- رسالة الترحيب العائمة -->
<div id="welcomeToast" class="welcome-toast">
    <i class="fas fa-microphone-alt"></i> SC Voice | جاهز للإبداع الصوتي الاحترافي
</div>

<!-- التطبيق الرئيسي -->
<div class="phone-app">
    <div class="app-header">
        <h1><i class="fas fa-microphone-alt"></i> SC Voice</h1>
        <p><i class="fas fa-waveform"></i> تطبيق معالجة الاصوات بدقة 192kHz <i class="fas fa-chart-line"></i></p>
    </div>

    <div class="time-box">
        <div class="timer" id="timerDisplay">00:00:00</div>
        <div class="status-label" id="recStatusLabel"><i class="fas fa-circle-notch"></i> غير نشط</div>
    </div>

    <div class="load-bar-container">
        <div class="load-bar" id="dynamicLoadBar"></div>
    </div>

    <div class="controls-row">
        <button id="pauseMainBtn" class="ctrl-side"><i class="fas fa-pause"></i></button>
        <button id="recordStopBtn" class="ctrl-center"><i class="fas fa-microphone-alt"></i><span>تسجيل</span></button>
        <button id="playbackToggleBtn" class="ctrl-side"><i class="fas fa-play"></i></button>
    </div>

    <div class="file-upload-row">
        <span><i class="fas fa-cloud-upload-alt"></i> رفع ملف صوتي</span>
        <label class="upload-label"><i class="fas fa-folder-open"></i> اختر ملف
            <input type="file" id="uploadAudio" accept="audio/*" style="display:none">
        </label>
    </div>

    <div class="fx-collapse">
        <div class="fx-header" id="fxHeader">
            <span><i class="fas fa-sliders-h"></i> مؤثرات سايبر متقدمة</span>
            <i class="fas fa-chevron-down" id="toggleIcon"></i>
        </div>
        <div class="fx-content" id="fxContent">
            <div class="fx-grid">
                <div class="fx-card"><label><i class="fas fa-volume-mute"></i> حجب الضوضاء (قاطع تام) <span id="gateVal">100%</span></label><div class="control-with-buttons"><button class="step-btn" data-target="noiseGate" data-dir="-">-</button><input type="range" id="noiseGate" min="0" max="100" value="100"><button class="step-btn" data-target="noiseGate" data-dir="+">+</button></div></div>
                <div class="fx-card"><label><i class="fas fa-chart-line"></i> معزز الجهير العميق <span id="bassVal">0dB</span></label><div class="control-with-buttons"><button class="step-btn" data-target="eqBass" data-dir="-">-</button><input type="range" id="eqBass" min="-18" max="18" value="0" step="1"><button class="step-btn" data-target="eqBass" data-dir="+">+</button></div></div>
                <div class="fx-card"><label><i class="fas fa-equalizer"></i> <i class="fas fa-sliders-h"></i> تردد وسط قوي <span id="midVal">0dB</span></label><div class="control-with-buttons"><button class="step-btn" data-target="eqMid" data-dir="-">-</button><input type="range" id="eqMid" min="-18" max="18" value="0" step="1"><button class="step-btn" data-target="eqMid" data-dir="+">+</button></div></div>
                <div class="fx-card"><label><i class="fas fa-highlighter"></i> تردد ثلاثي حاد <span id="trebVal">0dB</span></label><div class="control-with-buttons"><button class="step-btn" data-target="eqTreble" data-dir="-">-</button><input type="range" id="eqTreble" min="-18" max="18" value="0" step="1"><button class="step-btn" data-target="eqTreble" data-dir="+">+</button></div></div>
                <div class="fx-card"><label><i class="fas fa-compress-alt"></i> ضاغط ديناميكي <span id="compVal">50%</span></label><div class="control-with-buttons"><button class="step-btn" data-target="compression" data-dir="-">-</button><input type="range" id="compression" min="0" max="100" value="50"><button class="step-btn" data-target="compression" data-dir="+">+</button></div></div>
                <div class="fx-card"><label><i class="fas fa-waveform"></i> <i class="fas fa-chart-simple"></i> توحيد المستوى الاحترافي <span id="normVal">85%</span></label><div class="control-with-buttons"><button class="step-btn" data-target="normalize" data-dir="-">-</button><input type="range" id="normalize" min="0" max="100" value="85"><button class="step-btn" data-target="normalize" data-dir="+">+</button></div></div>
                <div class="fx-card"><label><i class="fas fa-droplet"></i> صدى إلكتروني <span id="revMixVal">25%</span></label><div class="control-with-buttons"><button class="step-btn" data-target="reverbMix" data-dir="-">-</button><input type="range" id="reverbMix" min="0" max="100" value="25"><button class="step-btn" data-target="reverbMix" data-dir="+">+</button></div></div>
                <div class="fx-card"><label><i class="fas fa-hourglass-half"></i> زمن التلاشي <span id="decayVal">0.9s</span></label><div class="control-with-buttons"><button class="step-btn" data-target="reverbDecay" data-dir="-">-</button><input type="range" id="reverbDecay" min="0.3" max="4.0" step="0.05" value="0.9"><button class="step-btn" data-target="reverbDecay" data-dir="+">+</button></div></div>
                <div class="fx-card"><label><i class="fas fa-music"></i> تغيير طبقة الصوت (نفس السرعة) <span id="pitchVal">0</span></label><div class="control-with-buttons"><button class="step-btn" data-target="pitchShift" data-dir="-">-</button><input type="range" id="pitchShift" min="-12" max="12" value="0" step="1"><button class="step-btn" data-target="pitchShift" data-dir="+">+</button></div></div>
            </div>
            <div class="action-group">
                <button id="applyFxBtn" class="small-btn"><i class="fas fa-magic"></i> تطبيق المؤثرات</button>
                <button id="playProcessedBtn" class="small-btn"><i class="fas fa-headphones"></i> معاينة الصوت</button>
                <button id="downloadProcessedBtn" class="small-btn"><i class="fas fa-download"></i> تنزيل MP3</button>
            </div>
            <div id="procStatus"><i class="fas fa-microchip"></i> معالجة فائقة - حجب تام للضوضاء</div>
        </div>
    </div>
    <footer><i class="fas fa-head-side-headphones"></i> جميع الحقوق محفوظة 2026© <i class="fas fa-charging-station"></i></footer>
</div>

<div id="toastMessage" class="status-toast" style="display: none;"></div>

<script>
    (function(){
        // ---------------- كود التطبيق الأساسي مع التعديلات ----------------
        const timerDisplay = document.getElementById('timerDisplay');
        const recStatusLabel = document.getElementById('recStatusLabel');
        const recordStopBtn = document.getElementById('recordStopBtn');
        const pauseBtn = document.getElementById('pauseMainBtn');
        const playbackToggleBtn = document.getElementById('playbackToggleBtn');
        const fileUpload = document.getElementById('uploadAudio');
        const toastEl = document.getElementById('toastMessage');
        const dynamicBar = document.getElementById('dynamicLoadBar');
        
        const noiseGate = document.getElementById('noiseGate');
        const eqBass = document.getElementById('eqBass');
        const eqMid = document.getElementById('eqMid');
        const eqTreble = document.getElementById('eqTreble');
        const compression = document.getElementById('compression');
        const normalize = document.getElementById('normalize');
        const reverbMix = document.getElementById('reverbMix');
        const reverbDecay = document.getElementById('reverbDecay');
        const pitchShift = document.getElementById('pitchShift');
        const applyFx = document.getElementById('applyFxBtn');
        const playProcessed = document.getElementById('playProcessedBtn');
        const downloadProcessed = document.getElementById('downloadProcessedBtn');
        const procStatusDiv = document.getElementById('procStatus');
        
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let isPaused = false;
        let elapsedSeconds = 0;
        let timerInterval = null;
        let mediaStream = null;
        let audioContext = null;
        let meterAnalyser = null;
        let originalBuffer = null;
        let processedBuffer = null;
        const targetSampleRate = 192000;
        let currentPlaybackSource = null;
        let isPlayingRaw = false;
        let playbackTimerInterval = null;
        let levelUpdateInterval = null;
        
        function showToast(msg, isError = false) {
            toastEl.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${msg}`;
            toastEl.style.display = 'block';
            toastEl.style.borderRightColor = isError ? '#ff3a6f' : '#ff66e6';
            setTimeout(() => { toastEl.style.display = 'none'; }, 2600);
        }
        
        function updateLoadBar(level) {
            let percent = Math.min(100, Math.floor(level * 110));
            if (percent < 0.5) percent = 0;
            dynamicBar.style.width = percent + '%';
            if (percent > 75) dynamicBar.style.background = "linear-gradient(90deg, #ff44e6, #ffaa66, #ff44e6)";
            else if (percent > 35) dynamicBar.style.background = "linear-gradient(90deg, #c97bff, #ff66c0)";
            else dynamicBar.style.background = "linear-gradient(90deg, #9c6eff, #c584ff)";
        }
        
        function startLevelMonitoring(analyserNode) {
            if (levelUpdateInterval) clearInterval(levelUpdateInterval);
            if (!analyserNode) return;
            const dataArray = new Uint8Array(analyserNode.frequencyBinCount);
            levelUpdateInterval = setInterval(() => {
                if (!analyserNode) return;
                analyserNode.getByteTimeDomainData(dataArray);
                let maxSample = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    let v = (dataArray[i] - 128) / 128;
                    if (Math.abs(v) > maxSample) maxSample = Math.abs(v);
                }
                let level = Math.min(1.0, maxSample * 1.65);
                updateLoadBar(level);
            }, 28);
        }
        
        function stopLevelMonitoring() {
            if (levelUpdateInterval) clearInterval(levelUpdateInterval);
            levelUpdateInterval = null;
            updateLoadBar(0);
        }
        
        async function initAudioContext() {
            if(audioContext && audioContext.state !== 'closed') return audioContext;
            audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: targetSampleRate });
            return audioContext;
        }
        
        function formatTime(seconds) {
            if (isNaN(seconds)) seconds = 0;
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            return `${hrs.toString().padStart(2,'0')}:${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
        }
        
        async function pitchShiftKeepDuration(buffer, semitones) {
            if (semitones === 0) return buffer;
            const ratio = Math.pow(2, semitones / 12);
            const originalLength = buffer.length;
            const channels = buffer.numberOfChannels;
            const newLength = Math.round(originalLength / ratio);
            const offline = new OfflineAudioContext({ numberOfChannels: channels, length: newLength, sampleRate: buffer.sampleRate });
            const src = offline.createBufferSource();
            src.buffer = buffer;
            src.playbackRate.value = ratio;
            src.connect(offline.destination);
            src.start();
            const resampled = await offline.startRendering();
            const finalOffline = new OfflineAudioContext({ numberOfChannels: channels, length: originalLength, sampleRate: buffer.sampleRate });
            const src2 = finalOffline.createBufferSource();
            src2.buffer = resampled;
            src2.connect(finalOffline.destination);
            src2.start();
            return await finalOffline.startRendering();
        }
        
        async function applyAllEffects(inputBuffer) {
            let proc = inputBuffer;
            const pitch = parseInt(pitchShift.value);
            if(pitch !== 0) proc = await pitchShiftKeepDuration(proc, pitch);
            const offline = new OfflineAudioContext({ numberOfChannels: proc.numberOfChannels, length: proc.length, sampleRate: proc.sampleRate });
            const src = offline.createBufferSource();
            src.buffer = proc;
            const gatePercent = parseInt(noiseGate.value) / 100;
            const ultraGate = offline.createDynamicsCompressor();
            ultraGate.threshold.value = -58 + (gatePercent * 18);
            ultraGate.ratio.value = 28 + (gatePercent * 48);
            ultraGate.attack.value = 0.0006;
            ultraGate.release.value = 0.018;
            const hissFilter = offline.createBiquadFilter();
            hissFilter.type = "lowpass";
            hissFilter.frequency.value = 10800 - (gatePercent * 1800);
            hissFilter.Q = 0.55;
            const lowShelf = offline.createBiquadFilter();
            lowShelf.type = 'lowshelf'; lowShelf.frequency = 180; lowShelf.gain.value = parseInt(eqBass.value) * 1.2;
            const midPeak = offline.createBiquadFilter();
            midPeak.type = 'peaking'; midPeak.frequency = 1100; midPeak.gain.value = parseInt(eqMid.value) * 1.25;
            const highShelf = offline.createBiquadFilter();
            highShelf.type = 'highshelf'; highShelf.frequency = 5200; highShelf.gain.value = parseInt(eqTreble.value) * 1.15;
            const comp = offline.createDynamicsCompressor();
            const compVal = parseInt(compression.value) / 100;
            comp.threshold.value = -24 + (compVal * -16);
            comp.ratio.value = 4.5 + compVal * 18;
            const revMixVal = parseInt(reverbMix.value) / 100;
            const decayVal = parseFloat(reverbDecay.value);
            const impulseLen = Math.min(proc.sampleRate * decayVal, proc.sampleRate * 3.2);
            const impulse = new AudioBuffer({ numberOfChannels: 2, length: impulseLen, sampleRate: proc.sampleRate });
            for (let c=0; c<2; c++) {
                const data = impulse.getChannelData(c);
                for (let i=0; i<impulseLen; i++) {
                    const env = Math.exp(-i / (proc.sampleRate * decayVal * 0.52));
                    data[i] = (Math.random() * 2 - 1) * env * (1 - i/impulseLen) * 0.7;
                }
            }
            const convolver = offline.createConvolver();
            convolver.buffer = impulse;
            const dryGain = offline.createGain();
            dryGain.gain.value = 1 - revMixVal;
            const wetGain = offline.createGain();
            wetGain.gain.value = revMixVal;
            const master = offline.createGain();
            src.connect(ultraGate);
            ultraGate.connect(hissFilter);
            hissFilter.connect(lowShelf);
            lowShelf.connect(midPeak);
            midPeak.connect(highShelf);
            highShelf.connect(comp);
            comp.connect(dryGain);
            comp.connect(convolver);
            convolver.connect(wetGain);
            dryGain.connect(master);
            wetGain.connect(master);
            master.connect(offline.destination);
            src.start();
            let rendered = await offline.startRendering();
            const normPercent = parseInt(normalize.value) / 100;
            if (normPercent > 0.05) {
                let maxVal = 0;
                for (let ch=0; ch<rendered.numberOfChannels; ch++) {
                    const data = rendered.getChannelData(ch);
                    for (let i=0; i<data.length; i++) maxVal = Math.max(maxVal, Math.abs(data[i]));
                }
                const targetGain = Math.min(2.0, (normPercent * 1.4 + 0.1) / maxVal);
                const normOffline = new OfflineAudioContext({ numberOfChannels: rendered.numberOfChannels, length: rendered.length, sampleRate: rendered.sampleRate });
                const srcNorm = normOffline.createBufferSource();
                srcNorm.buffer = rendered;
                const gainNode = normOffline.createGain();
                gainNode.gain.value = targetGain;
                srcNorm.connect(gainNode);
                gainNode.connect(normOffline.destination);
                srcNorm.start();
                rendered = await normOffline.startRendering();
            }
            return rendered;
        }
        
        async function playBufferWithDynamicBar(buffer) {
            if (currentPlaybackSource) { try { currentPlaybackSource.stop(); } catch(e) {} currentPlaybackSource = null; if (playbackTimerInterval) clearInterval(playbackTimerInterval); isPlayingRaw = false; playbackToggleBtn.innerHTML = '<i class="fas fa-play"></i>'; recStatusLabel.classList.remove('playing'); stopLevelMonitoring(); if(!isRecording && originalBuffer) timerDisplay.innerText = formatTime(originalBuffer.duration); return; }
            if (!buffer) { showToast("لا يوجد مقطع صوتي", true); return; }
            const ctx = await initAudioContext();
            if (ctx.state === 'suspended') await ctx.resume();
            const source = ctx.createBufferSource();
            source.buffer = buffer;
            const analyser = ctx.createAnalyser();
            analyser.fftSize = 256;
            source.connect(analyser);
            analyser.connect(ctx.destination);
            startLevelMonitoring(analyser);
            currentPlaybackSource = source;
            isPlayingRaw = true;
            const duration = buffer.duration;
            const startTime = ctx.currentTime;
            if (playbackTimerInterval) clearInterval(playbackTimerInterval);
            playbackTimerInterval = setInterval(() => {
                if (!currentPlaybackSource) { clearInterval(playbackTimerInterval); return; }
                const elapsed = Math.min(duration, ctx.currentTime - startTime);
                if (elapsed >= duration) { clearInterval(playbackTimerInterval); stopPlaybackCleanup(); } else timerDisplay.innerText = formatTime(elapsed);
            }, 100);
            source.onended = () => stopPlaybackCleanup();
            source.start();
            playbackToggleBtn.innerHTML = '<i class="fas fa-stop"></i>';
            recStatusLabel.innerHTML = '<i class="fas fa-headphones"></i> تشغيل ...';
            recStatusLabel.classList.add('playing');
        }
        
        function stopPlaybackCleanup() {
            if (currentPlaybackSource) { try { currentPlaybackSource.stop(); } catch(e) {} currentPlaybackSource = null; }
            if (playbackTimerInterval) clearInterval(playbackTimerInterval);
            isPlayingRaw = false;
            playbackToggleBtn.innerHTML = '<i class="fas fa-play"></i>';
            recStatusLabel.classList.remove('playing');
            stopLevelMonitoring();
            if (!isRecording && originalBuffer) timerDisplay.innerText = formatTime(originalBuffer.duration);
            else if(!isRecording) timerDisplay.innerText = '00:00:00';
            recStatusLabel.innerHTML = isRecording ? '<i class="fas fa-circle"></i> تسجيل 192kHz...' : '<i class="fas fa-stop"></i> متوقف';
        }
        
        async function startRecording() {
            if(isRecording && !isPaused) return;
            if(mediaRecorder && isPaused && mediaRecorder.state === 'paused') {
                // استئناف التسجيل
                mediaRecorder.resume();
                isPaused = false;
                startTimer();
                recStatusLabel.innerHTML='<i class="fas fa-microphone-alt"></i> جاري التسجيل 192kHz...';
                recStatusLabel.classList.add('recording');
                pauseBtn.innerHTML='<i class="fas fa-pause"></i>';
                showToast("⏵ استئناف التسجيل", false);
                return;
            }
            // بدء تسجيل جديد
            if(mediaStream) mediaStream.getTracks().forEach(t=>t.stop());
            const stream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: targetSampleRate, channelCount:2, echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
            mediaStream = stream;
            const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
            mediaRecorder = new MediaRecorder(stream, { mimeType: mime, audioBitsPerSecond: 1500000 });
            audioChunks = [];
            mediaRecorder.ondataavailable = e => { if(e.data.size) audioChunks.push(e.data); };
            mediaRecorder.onstop = async () => {
                const blob = new Blob(audioChunks, { type: mime });
                const buf = await blob.arrayBuffer();
                const ctx = await initAudioContext();
                let decoded = await ctx.decodeAudioData(buf);
                if(decoded.sampleRate !== targetSampleRate) {
                    const offlineCtx = new OfflineAudioContext({ numberOfChannels: decoded.numberOfChannels, length: Math.floor(decoded.length * targetSampleRate / decoded.sampleRate), sampleRate: targetSampleRate });
                    const src = offlineCtx.createBufferSource();
                    src.buffer = decoded;
                    src.connect(offlineCtx.destination);
                    src.start();
                    decoded = await offlineCtx.startRendering();
                }
                originalBuffer = decoded;
                processedBuffer = null;
                procStatusDiv.innerHTML = `<i class="fas fa-check-circle"></i> تسجيل ${decoded.duration.toFixed(2)} ث | ${decoded.sampleRate/1000}kHz فائق`;
                timerDisplay.innerText = formatTime(decoded.duration);
                showToast(`تم التسجيل بجودة 192kHz`, false);
            };
            mediaRecorder.start(1000);
            isRecording = true; isPaused = false; elapsedSeconds = 0;
            startTimer();
            recStatusLabel.innerHTML = '<i class="fas fa-microphone-alt"></i> جاري التسجيل 192kHz...';
            recStatusLabel.classList.add('recording');
            pauseBtn.disabled = false; pauseBtn.classList.remove('disabled-btn');
            pauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
            recordStopBtn.innerHTML = '<i class="fas fa-stop"></i><span>إيقاف</span>';
            const ctx = await initAudioContext();
            const source = ctx.createMediaStreamSource(stream);
            if(meterAnalyser) meterAnalyser.disconnect?.();
            meterAnalyser = ctx.createAnalyser();
            meterAnalyser.fftSize = 512;
            source.connect(meterAnalyser);
            startLevelMonitoring(meterAnalyser);
            showToast("🎙️ تسجيل 192kHz فائق الجودة", false);
        }
        
        function stopRecording() {
            if(mediaRecorder && (mediaRecorder.state==='recording'||mediaRecorder.state==='paused')) {
                mediaRecorder.stop();
                isRecording = false;
                isPaused = false;
                if(timerInterval) clearInterval(timerInterval);
                recStatusLabel.innerHTML='<i class="fas fa-stop"></i> متوقف';
                recStatusLabel.classList.remove('recording');
                recordStopBtn.innerHTML = '<i class="fas fa-microphone-alt"></i><span>تسجيل</span>';
                pauseBtn.disabled = true;
                pauseBtn.classList.add('disabled-btn');
                pauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                if(mediaStream) mediaStream.getTracks().forEach(t=>t.stop());
                mediaStream = null;
                meterAnalyser = null;
                stopLevelMonitoring();
                if(originalBuffer) timerDisplay.innerText = formatTime(originalBuffer.duration);
                showToast("⏹ تم إيقاف التسجيل", false);
            }
        }
        
        function togglePauseRecording() {
            if (!isRecording) return;
            if (isPaused) {
                // استئناف
                if (mediaRecorder && mediaRecorder.state === 'paused') {
                    mediaRecorder.resume();
                    isPaused = false;
                    startTimer();
                    recStatusLabel.innerHTML='<i class="fas fa-microphone-alt"></i> جاري التسجيل 192kHz...';
                    recStatusLabel.classList.add('recording');
                    pauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                    showToast("⏵ استئناف التسجيل", false);
                } else {
                    showToast("لا يمكن الاستئناف، حاول إعادة التسجيل", true);
                }
            } else {
                // إيقاف مؤقت
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                    mediaRecorder.pause();
                    isPaused = true;
                    if(timerInterval) clearInterval(timerInterval);
                    recStatusLabel.innerHTML='<i class="fas fa-pause"></i> متوقف مؤقت';
                    pauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                    showToast("⏸ توقف مؤقت", false);
                } else {
                    showToast("لا يوجد تسجيل نشط للإيقاف المؤقت", true);
                }
            }
        }
        
        function startTimer() {
            if(timerInterval) clearInterval(timerInterval);
            const start=Date.now()-elapsedSeconds*1000;
            timerInterval=setInterval(()=>{
                if(!isPaused) {
                    elapsedSeconds=Math.floor((Date.now()-start)/1000);
                    timerDisplay.innerText=formatTime(elapsedSeconds);
                }
            },200);
        }
        
        async function togglePlayRaw() {
            if(!originalBuffer) { showToast("لا يوجد تسجيل أو ملف", true); return; }
            if(currentPlaybackSource) { stopPlaybackCleanup(); return; }
            await playBufferWithDynamicBar(originalBuffer);
        }
        
        async function handleFileUpload(file) {
            if(!file) return;
            procStatusDiv.innerHTML='<i class="fas fa-upload"></i> رفع وتحويل...';
            const buf=await file.arrayBuffer();
            const ctx=await initAudioContext();
            let decoded=await ctx.decodeAudioData(buf);
            if(decoded.sampleRate!==targetSampleRate) {
                const offlineCtx=new OfflineAudioContext({ numberOfChannels:decoded.numberOfChannels, length:Math.floor(decoded.length*targetSampleRate/decoded.sampleRate), sampleRate:targetSampleRate });
                const src=offlineCtx.createBufferSource();
                src.buffer=decoded;
                src.connect(offlineCtx.destination);
                src.start();
                decoded=await offlineCtx.startRendering();
            }
            originalBuffer=decoded;
            processedBuffer=null;
            procStatusDiv.innerHTML=`<i class="fas fa-file-audio"></i> رفع: ${decoded.duration.toFixed(2)} ث - ${decoded.sampleRate/1000}kHz`;
            if(currentPlaybackSource) stopPlaybackCleanup();
            timerDisplay.innerText=formatTime(decoded.duration);
            showToast("تم رفع الملف بنجاح", false);
        }
        
        async function processFull() {
            if(!originalBuffer) { showToast("سجل أو ارفع صوتاً أولاً", true); return; }
            procStatusDiv.innerHTML='<i class="fas fa-microchip"></i> معالجة سايبر (حجب تام)...';
            applyFx.disabled=true;
            try {
                const result=await applyAllEffects(originalBuffer);
                processedBuffer=result;
                procStatusDiv.innerHTML=`<i class="fas fa-check-double"></i> تم التطبيق · ${(result.sampleRate/1000)}kHz · عزل كامل`;
                playProcessed.disabled=false;
                downloadProcessed.disabled=false;
                showToast("المؤثرات مطبقة بأقصى قوة", false);
            } catch(e) {
                procStatusDiv.innerHTML='<i class="fas fa-exclamation-triangle"></i> خطأ: '+e.message;
                showToast("خطأ في المعالجة", true);
            } finally {
                applyFx.disabled=false;
            }
        }
        
        function playProcessedAudio() {
            if(!processedBuffer) { showToast("قم بتطبيق المؤثرات أولاً", true); return; }
            if(currentPlaybackSource) stopPlaybackCleanup();
            playBufferWithDynamicBar(processedBuffer);
        }
        
        // دالة تنزيل متطورة تطلب موقع الحفظ
        async function downloadAsMp3WithSaveDialog() {
            const bufferToSave = processedBuffer || originalBuffer;
            if (!bufferToSave) {
                showToast("لا يوجد صوت للحفظ", true);
                return;
            }
            try {
                // تحويل AudioBuffer إلى MP3 باستخدام lamejs
                const ch = bufferToSave.numberOfChannels;
                const sr = bufferToSave.sampleRate;
                const samples = bufferToSave.length;
                const left = bufferToSave.getChannelData(0);
                const right = ch > 1 ? bufferToSave.getChannelData(1) : left;
                const encoder = new lamejs.Mp3Encoder(ch, sr, 320);
                const mp3Data = [];
                const block = 1152;
                for (let i = 0; i < samples; i += block) {
                    const L = left.subarray(i, Math.min(i + block, samples));
                    const R = right.subarray(i, Math.min(i + block, samples));
                    const L16 = new Int16Array(L.length);
                    const R16 = new Int16Array(R.length);
                    for (let j = 0; j < L.length; j++) {
                        L16[j] = Math.max(-32768, Math.min(32767, L[j] * 32768));
                        if (ch > 1) R16[j] = Math.max(-32768, Math.min(32767, R[j] * 32768));
                    }
                    const mp3buf = (ch === 1) ? encoder.encodeBuffer(L16) : encoder.encodeBuffer(L16, R16);
                    if (mp3buf.length) mp3Data.push(mp3buf);
                }
                const end = encoder.flush();
                if (end.length) mp3Data.push(end);
                const blob = new Blob(mp3Data, { type: 'audio/mp3' });
                
                // محاولة استخدام File System Access API لطلب موقع الحفظ
                if (window.showSaveFilePicker) {
                    try {
                        const opts = {
                            suggestedName: 'sc_voice_pro_192kHz.mp3',
                            types: [{
                                description: 'MP3 Audio',
                                accept: { 'audio/mpeg': ['.mp3'] }
                            }]
                        };
                        const fileHandle = await window.showSaveFilePicker(opts);
                        const writable = await fileHandle.createWritable();
                        await writable.write(blob);
                        await writable.close();
                        showToast("✅ تم حفظ الملف في الموقع المختار", false);
                        return;
                    } catch (err) {
                        if (err.name !== 'AbortError') {
                            console.warn('Save picker error, falling back to default download', err);
                        } else {
                            // المستخدم ألغى العملية
                            return;
                        }
                    }
                }
                // الطريقة الاحتياطية: التنزيل المباشر
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'sc_voice_pro_192kHz.mp3';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast("✅ تم تنزيل MP3 (حفظ في مجلد التنزيلات)", false);
            } catch(e) {
                showToast("فشل إنشاء MP3: " + e.message, true);
            }
        }
        
        function updateValues() {
            document.getElementById('gateVal').innerText = noiseGate.value+'%';
            document.getElementById('bassVal').innerText = (parseInt(eqBass.value)>=0?'+':'')+eqBass.value+'dB';
            document.getElementById('midVal').innerText = (parseInt(eqMid.value)>=0?'+':'')+eqMid.value+'dB';
            document.getElementById('trebVal').innerText = (parseInt(eqTreble.value)>=0?'+':'')+eqTreble.value+'dB';
            document.getElementById('compVal').innerText = compression.value+'%';
            document.getElementById('normVal').innerText = normalize.value+'%';
            document.getElementById('revMixVal').innerText = reverbMix.value+'%';
            document.getElementById('decayVal').innerText = parseFloat(reverbDecay.value).toFixed(2)+'s';
            document.getElementById('pitchVal').innerText = pitchShift.value;
        }
        
        document.querySelectorAll('.step-btn').forEach(btn => btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const targetId = btn.getAttribute('data-target');
            const dir = btn.getAttribute('data-dir');
            const targetElem = document.getElementById(targetId);
            if (!targetElem) return;
            let step = (targetId === 'reverbDecay') ? 0.1 : ((targetId === 'pitchShift') ? 1 : 1);
            let val = parseFloat(targetElem.value);
            val += (dir === '+') ? step : -step;
            if (targetId === 'noiseGate') val = Math.min(100, Math.max(0, val));
            if (['eqBass','eqMid','eqTreble'].includes(targetId)) val = Math.min(18, Math.max(-18, val));
            if (targetId === 'compression' || targetId === 'normalize' || targetId === 'reverbMix') val = Math.min(100, Math.max(0, val));
            if (targetId === 'reverbDecay') val = Math.min(4.0, Math.max(0.3, val));
            if (targetId === 'pitchShift') val = Math.min(12, Math.max(-12, val));
            targetElem.value = val;
            targetElem.dispatchEvent(new Event('input'));
            updateValues();
        }));
        
        [noiseGate, eqBass, eqMid, eqTreble, compression, normalize, reverbMix, reverbDecay, pitchShift].forEach(s=>s.addEventListener('input', updateValues));
        updateValues();
        
        recordStopBtn.addEventListener('click', () => { if(isRecording) stopRecording(); else startRecording(); });
        pauseBtn.addEventListener('click', togglePauseRecording);
        playbackToggleBtn.addEventListener('click', togglePlayRaw);
        fileUpload.addEventListener('change', (e) => { if(e.target.files.length) handleFileUpload(e.target.files[0]); fileUpload.value=''; });
        applyFx.addEventListener('click', processFull);
        playProcessed.addEventListener('click', playProcessedAudio);
        downloadProcessed.addEventListener('click', downloadAsMp3WithSaveDialog);
        
        const fxHeader=document.getElementById('fxHeader'), fxContent=document.getElementById('fxContent'), toggleIcon=document.getElementById('toggleIcon');
        fxHeader.addEventListener('click', () => { fxContent.classList.toggle('open'); toggleIcon.classList.toggle('fa-chevron-down'); toggleIcon.classList.toggle('fa-chevron-up'); });
        
        pauseBtn.disabled=true; pauseBtn.classList.add('disabled-btn');
        playProcessed.disabled=true; downloadProcessed.disabled=false;
        initAudioContext().then(()=>{ navigator.mediaDevices.getUserMedia({audio:true}).catch(()=>{}); });
        document.body.addEventListener('click',()=>{ if(audioContext && audioContext.state==='suspended') audioContext.resume(); });
        stopLevelMonitoring();
        
        // SPLASH SCREEN
        const splash = document.getElementById('splashScreen');
        const welcomeDiv = document.getElementById('welcomeToast');
        setTimeout(() => {
            if(splash) splash.classList.add('hide');
            welcomeDiv.classList.add('show');
            setTimeout(() => {
                welcomeDiv.classList.remove('show');
            }, 3800);
        }, 4200);
    })();
</script>
</body>
</html>
